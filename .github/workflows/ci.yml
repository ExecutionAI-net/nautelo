name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nautelo
          POSTGRES_USER: nautelo
          POSTGRES_PASSWORD: nautelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nautelo"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3020
      DATABASE_URL: postgres://nautelo:nautelo@localhost:5432/nautelo
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CHANNELS_REDIS_URL: redis://localhost:6379/3
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_ci
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@nautelo.local
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9010
      OBJECT_STORAGE_ACCESS_KEY: nautelo
      OBJECT_STORAGE_SECRET_KEY: nautelo123
      OBJECT_STORAGE_BUCKET_NAME: nautelo-media
      OBJECT_STORAGE_REGION: us-east-1
      CONTACT_HASH_SECRET: ci-test-secret
      INTERNAL_SERVICE_SECRET: ci-test-secret
      PUBLIC_BASE_URL: http://localhost:3020
    steps:
      - uses: actions/checkout@v4

      - name: Check backend project exists
        id: check
        run: |
          if [ -f "backend/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pyproject.toml yet — nothing to test."
          fi

      - name: Install uv
        if: steps.check.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv sync

      - name: Start MinIO (via root docker compose)
        if: steps.check.outputs.exists == 'true'
        run: |
          docker compose -f docker-compose.yml up -d --wait minio
          docker compose -f docker-compose.yml up createbuckets

      - name: Django system check
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run python manage.py check

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          if find . -type f -name "test_*.py" -not -path "./.venv/*" | grep -q .; then
            uv run pytest -v
          else
            echo "No test_*.py files yet — skipping pytest."
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend project exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet — nothing to build."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
        with:
          version: 12

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          # 22, not 20: jsdom 30 (via undici 8) calls worker_threads.markAsUncloneable,
          # which landed in Node 22.10.0 and was never backported to the 20.x line —
          # the final 20.20.2 release still lacks it. vitest 5 and jsdom 30 both
          # declare Node 20 unsupported in their `engines` fields.
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8020
        run: pnpm build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment configuration and failure handling
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Validate both application stacks and shared proxy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from deploy.manage import environments, write_env
          runtime = Path('/tmp/nautelo-compose-validation')
          runtime.mkdir(mode=0o700)
          sample = json.loads(Path('deploy/secret.example.json').read_text())
          for service, values in environments(sample, 'eu-west-1').items():
              write_env(runtime / f'{service}.env', values)
          PY
          export RUNTIME_DIR=/tmp/nautelo-compose-validation
          export BACKEND_IMAGE=nautelo-backend:validation FRONTEND_IMAGE=nautelo-frontend:validation
          docker compose -f deploy/docker-compose.dev.yml config --quiet
          docker compose -f deploy/docker-compose.prod.yml config --quiet
          docker compose -f deploy/docker-compose.proxy.yml config --quiet
          DEV_HTTP_HOST=108.130.226.143 docker compose -f deploy/docker-compose.proxy.dev-http.yml config --quiet
      - name: Validate dev HTTP Nginx configuration
        run: |
          docker run --rm -e DEV_HTTP_HOST=108.130.226.143 \
            -v "$PWD/deploy/nginx.dev-http.conf:/etc/nginx/templates/default.conf.template:ro" \
            nginx:stable-alpine nginx -t
      - name: Validate Cloudflare HTTPS Nginx configuration
        run: |
          tls_dir=$(mktemp -d)
          trap 'rm -rf "$tls_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=nautelo.com' -addext 'subjectAltName=DNS:nautelo.com,DNS:*.nautelo.com' \
            -keyout "$tls_dir/origin.key" -out "$tls_dir/origin.pem"
          docker run --rm \
            -v "$tls_dir:/etc/nginx/origin:ro" \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro" \
            nginx:stable-alpine nginx -t
