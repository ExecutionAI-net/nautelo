services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nautelo
      POSTGRES_USER: nautelo
      POSTGRES_PASSWORD: nautelo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautelo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # quay.io/minio/* stopped serving anonymous pulls on 2026-09-24 (MinIO's own
  # registry policy change, not project-specific - it broke public CI
  # everywhere overnight). Chainguard mirrors both images and still allows
  # anonymous pulls of their non-"-dev" tags. Both images are fully
  # distroless (no /bin/sh, and no Docker HEALTHCHECK either - `docker
  # compose run --depends_on condition: service_healthy` errors outright
  # with "no healthcheck configured" if you try). Readiness is instead
  # polled from the CI workflow via curl against minio's own
  # /minio/health/live HTTP endpoint (a real server feature, not a shell
  # script). Bucket setup is two separate `mc` invocations from the CI
  # workflow rather than an entrypoint script, since there's no shell to
  # run one in; they share the mc_config volume so the alias set by the
  # first invocation is still there for the second.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nautelo
      MINIO_ROOT_PASSWORD: nautelo123
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_CONFIG_DIR: /mc-config
    volumes:
      - mc_config:/mc-config

volumes:
  postgres_data:
  minio_data:
  mc_config:
