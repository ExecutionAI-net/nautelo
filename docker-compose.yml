services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nautelo
      POSTGRES_USER: nautelo
      POSTGRES_PASSWORD: nautelo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautelo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # quay.io/minio/* stopped serving anonymous pulls on 2026-09-24 (MinIO's own
  # registry policy change, not project-specific - it broke public CI
  # everywhere overnight). Chainguard mirrors both images and still allows
  # anonymous pulls of their non-"-dev" tags. Both images are fully
  # distroless (no /bin/sh in either one), but the server image ships its
  # own built-in Docker HEALTHCHECK, so `--wait` still works for it. The
  # client image can't run a shell script, so bucket setup happens as two
  # separate `mc` invocations from the CI workflow instead of an
  # entrypoint script; they share the mc_config volume so the alias set by
  # the first invocation is still there for the second.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nautelo
      MINIO_ROOT_PASSWORD: nautelo123
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_CONFIG_DIR: /mc-config
    volumes:
      - mc_config:/mc-config

volumes:
  postgres_data:
  minio_data:
  mc_config:
