services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nautelo
      POSTGRES_USER: nautelo
      POSTGRES_PASSWORD: nautelo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautelo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # quay.io/minio/* stopped serving anonymous pulls on 2026-09-24 (MinIO's own
  # registry policy change, not project-specific - it broke public CI
  # everywhere overnight). Chainguard mirrors both images and still allows
  # anonymous pulls of their non-"-dev" tags. The server image is a bare,
  # shell-less binary (no curl to health-check with), so readiness is proven
  # by createbuckets' own retry loop below instead of a Docker healthcheck.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nautelo
      MINIO_ROOT_PASSWORD: nautelo123
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 nautelo nautelo123 >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do
        i=$$((i + 1));
        if [ $$i -ge 60 ]; then echo 'minio did not become ready in time' >&2; exit 1; fi;
        sleep 1;
      done;
      mc mb -p local/nautelo-media;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
