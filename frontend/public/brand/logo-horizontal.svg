<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240">
  <defs>
    <!-- Brass / Gold Luxury Gradients -->
    <linearGradient id="rectGoldBorderOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="25%" stop-color="#dbb86e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="75%" stop-color="#e8cf8d"/>
      <stop offset="100%" stop-color="#916e28"/>
    </linearGradient>
    <linearGradient id="rectGoldInnerOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd59b"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="fullGoldGradOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd59b"/>
      <stop offset="35%" stop-color="#dbb86e"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#916e28"/>
    </linearGradient>
    <linearGradient id="fullGoldLightOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d1"/>
      <stop offset="100%" stop-color="#d6b063"/>
    </linearGradient>
    <!-- Deep Maritime Navy Gradient -->
    <linearGradient id="fullNavyGradOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e465e"/>
      <stop offset="50%" stop-color="#102a38"/>
      <stop offset="100%" stop-color="#081720"/>
    </linearGradient>
    <!-- Mediterranean Sea Teal Gradient -->
    <linearGradient id="fullTealGradOpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a0b0"/>
      <stop offset="60%" stop-color="#00696e"/>
      <stop offset="100%" stop-color="#004347"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="fullShadowOpt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a1d27" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Warm Off-White / Sand Marble Surface Card - Alt kısımdaki boşluk tamamen kaldırılarak altın kenarlığa tam sıfırlanmış oran -->
  <rect width="740" height="240" fill="#fbf9f4" rx="20"/>
  <!-- Luxury Outer Gold Hat / Border -->
  <rect x="2.5" y="2.5" width="735" height="235" fill="none" stroke="url(#rectGoldBorderOpt)" stroke-width="2.5" rx="18"/>
  <rect x="6" y="6" width="728" height="228" fill="none" stroke="url(#rectGoldInnerOpt)" stroke-width="0.8" opacity="0.6" rx="15"/>

  <!-- ========================================== -->
  <!-- LEFT: COMPLETE NAUTELO EMBLEM / MONOGRAM   -->
  <!-- ========================================== -->
  <g transform="translate(130, 120)" filter="url(#fullShadowOpt)">
    <!-- Outer Precision Brass Rings -->
    <circle r="80" fill="#ffffff" stroke="url(#fullGoldGradOpt)" stroke-width="3"/>
    <circle r="73.5" fill="none" stroke="#102a38" stroke-width="0.85" stroke-dasharray="2.5, 4.5" opacity="0.75"/>
    <circle r="65" fill="#102a38" fill-opacity="0.03" stroke="url(#fullGoldGradOpt)" stroke-width="0.8"/>

    <!-- Cardinal Degree Ticks (N, S, E, W) -->
    <line x1="0" y1="-84" x2="0" y2="-76" stroke="url(#fullGoldGradOpt)" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="0" x2="76" y2="0" stroke="url(#fullGoldGradOpt)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="84" x2="0" y2="76" stroke="url(#fullGoldGradOpt)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-84" y1="0" x2="-76" y2="0" stroke="url(#fullGoldGradOpt)" stroke-width="3" stroke-linecap="round"/>

    <!-- Intercardinal 45° Ticks -->
    <line x1="55" y1="-55" x2="50" y2="-50" stroke="url(#fullGoldGradOpt)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="50" y2="50" stroke="url(#fullGoldGradOpt)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-55" y1="55" x2="-50" y2="50" stroke="url(#fullGoldGradOpt)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-55" y1="-55" x2="-50" y2="-50" stroke="url(#fullGoldGradOpt)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cardinal N Mark -->
    <text x="0" y="-66" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="8.5" font-weight="700" fill="#916e28" text-anchor="middle">N</text>

    <!-- Yacht Sail 1: Mainsail / Genoa (Navy Blue) -->
    <path d="M-8,40 C-8,-15 13,-50 20,-55 C20,-55 30,15 -2,45 Z" fill="url(#fullNavyGradOpt)"/>

    <!-- Yacht Sail 2: Jib / Spinnaker (Mediterranean Teal) -->
    <path d="M-14,40 C-14,-2 -38,-28 -47,-32 C-47,-32 -23,13 -14,40 Z" fill="url(#fullTealGradOpt)" opacity="0.94"/>

    <!-- Golden Horizon Wave & Keel Arc -->
    <path d="M-52,45 C-17,38 27,51 54,41 C37,49 -17,53 -52,45 Z" fill="url(#fullGoldGradOpt)"/>

    <!-- Pinned North Star Compass Accent -->
    <g transform="translate(20, -12)">
      <!-- North Pointer -->
      <polygon points="0,-25 3,-5.5 0,0" fill="url(#fullGoldLightOpt)"/>
      <polygon points="0,-25 -3,-5.5 0,0" fill="#916e28"/>
      <!-- South Pointer -->
      <polygon points="0,16.5 2.3,3.8 0,0" fill="url(#fullGoldLightOpt)"/>
      <polygon points="0,16.5 -2.3,3.8 0,0" fill="#916e28"/>
      <!-- East Pointer -->
      <polygon points="16.5,0 3.8,2.3 0,0" fill="url(#fullGoldLightOpt)"/>
      <polygon points="16.5,0 3.8,-2.3 0,0" fill="#916e28"/>
      <!-- West Pointer -->
      <polygon points="-16.5,0 -3.8,2.3 0,0" fill="url(#fullGoldLightOpt)"/>
      <polygon points="-16.5,0 -3.8,-2.3 0,0" fill="#916e28"/>
      <!-- Pivot Pin -->
      <circle r="2.6" fill="#fbf9f4" stroke="url(#fullGoldGradOpt)" stroke-width="1.6"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: FULL NAUTELO WORDMARK & BRAND SYSTEM -->
  <!-- ========================================== -->
  <g transform="translate(242, 0)">
    
    <!-- Top Overline / Category Descriptor -->
    <g transform="translate(3, 58)">
      <line x1="0" y1="-4" x2="28" y2="-4" stroke="url(#fullGoldGradOpt)" stroke-width="2"/>
      <text x="36" y="0" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11.5" font-weight="700" letter-spacing="4" fill="#00696e">MEDITERRANEAN MARITIME EXCHANGE</text>
    </g>

    <!-- FULL PRIMARY WORDMARK: NAUTELO (Kusursuz Lüks Tipografi) -->
    <text x="0" y="132" font-family="'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif" font-size="64" font-weight="700" letter-spacing="7" fill="#102a38">NAUTELO</text>

    <!-- Refined Baseline Divider with Brass Compass Star -->
    <g transform="translate(2, 156)">
      <line x1="0" y1="0" x2="465" y2="0" stroke="#ddd8cd" stroke-width="1"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="url(#fullGoldGradOpt)" stroke-width="2"/>
      
      <!-- Brass Diamond / Compass Pip at midpoint -->
      <g transform="translate(190, 0)">
        <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="url(#fullGoldGradOpt)"/>
      </g>
    </g>

    <!-- Bottom Pillars Subtitle -->
    <text x="3" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.6" fill="#4d5b66">YACHTS · BROKERAGE · CHARTER · BERTHS</text>

    <!-- Geographic Origin Datum (Milan Duomo Coordinates) -->
    <g transform="translate(3, 204)">
      <circle cx="2.5" cy="-3.2" r="2" fill="url(#fullGoldGradOpt)"/>
      <text x="12" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#99732f">EST. 2026 · 45°27′49″N · 09°11′23″E</text>
    </g>
  </g>
</svg>