<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Brass / Gold Luxury Gradients -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="25%" stop-color="#dbb86e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="75%" stop-color="#e8cf8d"/>
      <stop offset="100%" stop-color="#916e28"/>
    </linearGradient>
    <linearGradient id="goldInnerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd59b"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="goldGradSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd59b"/>
      <stop offset="35%" stop-color="#dbb86e"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#916e28"/>
    </linearGradient>
    <linearGradient id="goldLightSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d1"/>
      <stop offset="100%" stop-color="#d6b063"/>
    </linearGradient>
    <!-- Deep Maritime Navy Gradient -->
    <linearGradient id="navyGradSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e465e"/>
      <stop offset="50%" stop-color="#102a38"/>
      <stop offset="100%" stop-color="#081720"/>
    </linearGradient>
    <!-- Mediterranean Sea Teal Gradient -->
    <linearGradient id="tealGradSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a0b0"/>
      <stop offset="60%" stop-color="#00696e"/>
      <stop offset="100%" stop-color="#004347"/>
    </linearGradient>
    <!-- Subtle Ambient Drop Shadow -->
    <filter id="soloShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a1d27" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0a1d27" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a1d27" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Warm Sand / Marble Surface Card with Luxury Double Gold Border -->
  <rect width="400" height="400" fill="#fbf9f4" rx="28" filter="url(#cardShadow)"/>
  
  <!-- Outer Gold Stroke Frame (Altın Rengi Dış Hat) -->
  <rect x="3" y="3" width="394" height="394" fill="none" stroke="url(#goldBorderGrad)" stroke-width="3" rx="25"/>
  <!-- Thin Inner Accent Gold Line (İç İnce Altın Zarafet Çizgisi) -->
  <rect x="7" y="7" width="386" height="386" fill="none" stroke="url(#goldInnerGlow)" stroke-width="0.8" opacity="0.65" rx="22"/>

  <!-- CENTRAL EMBLEM / MONOGRAM (Tamamen Değiştirilmeden Korunan Orijinal Logo) -->
  <g transform="translate(200, 200)" filter="url(#soloShadow)">
    
    <!-- Outer Precision Brass Astrolabe / Compass Rings -->
    <circle r="148" fill="#ffffff" stroke="url(#goldGradSolo)" stroke-width="4.5"/>
    <circle r="138" fill="none" stroke="#102a38" stroke-width="1.2" stroke-dasharray="3, 7" opacity="0.75"/>
    <circle r="126" fill="#102a38" fill-opacity="0.035" stroke="url(#goldGradSolo)" stroke-width="1"/>

    <!-- Degree Ticks - Major Cardinal Points (N, S, E, W) -->
    <line x1="0" y1="-154" x2="0" y2="-142" stroke="url(#goldGradSolo)" stroke-width="4" stroke-linecap="round"/>
    <line x1="154" y1="0" x2="142" y2="0" stroke="url(#goldGradSolo)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="154" x2="0" y2="142" stroke="url(#goldGradSolo)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-154" y1="0" x2="-142" y2="0" stroke="url(#goldGradSolo)" stroke-width="4" stroke-linecap="round"/>

    <!-- Degree Ticks - Intercardinal 45° -->
    <line x1="102" y1="-102" x2="94" y2="-94" stroke="url(#goldGradSolo)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="102" y1="102" x2="94" y2="94" stroke="url(#goldGradSolo)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-102" y1="102" x2="-94" y2="94" stroke="url(#goldGradSolo)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-102" y1="-102" x2="-94" y2="-94" stroke="url(#goldGradSolo)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Degree Ticks - Fine Tertiary 15° & 30° -->
    <g stroke="url(#goldGradSolo)" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(15)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(30)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(60)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(75)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(105)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(120)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(150)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(165)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(195)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(210)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(240)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(255)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(285)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(300)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(330)"/>
      <line x1="0" y1="-146" x2="0" y2="-140" transform="rotate(345)"/>
    </g>

    <!-- Cardinal Direction Letter N -->
    <text x="0" y="-126" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="700" letter-spacing="1" fill="#916e28" text-anchor="middle">N</text>

    <!-- Yacht Sail 1: Mainsail / Genoa (Navy Blue - soaring aerodynamic curvature) -->
    <path d="M-14,75 C-14,-28 24,-94 36,-102 C36,-102 54,26 -4,83 Z" fill="url(#navyGradSolo)"/>

    <!-- Yacht Sail 2: Jib / Spinnaker (Mediterranean Teal - wind filled sail) -->
    <path d="M-26,75 C-26,-4 -70,-50 -86,-58 C-86,-58 -42,24 -26,75 Z" fill="url(#tealGradSolo)" opacity="0.94"/>

    <!-- Golden Horizon Wave & Yacht Keel Baseline Arc -->
    <path d="M-95,84 C-30,72 50,96 100,76 C70,92 -30,100 -95,84 Z" fill="url(#goldGradSolo)"/>

    <!-- Compass Rose North Star (Faceted Brass Star pinned at intersection) -->
    <g transform="translate(36, -24)">
      <!-- North Pointer -->
      <polygon points="0,-45 6,-10 0,0" fill="url(#goldLightSolo)"/>
      <polygon points="0,-45 -6,-10 0,0" fill="#916e28"/>
      <!-- South Pointer -->
      <polygon points="0,30 5,8 0,0" fill="url(#goldLightSolo)"/>
      <polygon points="0,30 -5,8 0,0" fill="#916e28"/>
      <!-- East Pointer -->
      <polygon points="30,0 8,5 0,0" fill="url(#goldLightSolo)"/>
      <polygon points="30,0 8,-5 0,0" fill="#916e28"/>
      <!-- West Pointer -->
      <polygon points="-30,0 -8,5 0,0" fill="url(#goldLightSolo)"/>
      <polygon points="-30,0 -8,-5 0,0" fill="#916e28"/>
      <!-- Center Pivot Pin -->
      <circle r="4.5" fill="#fbf9f4" stroke="url(#goldGradSolo)" stroke-width="2.5"/>
    </g>
  </g>
</svg>