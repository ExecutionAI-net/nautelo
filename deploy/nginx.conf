# Replace SITE_DOMAIN and API_DOMAIN (e.g. nauta.com / api.nauta.com) before use.
# Certificates: certbot certonly --webroot -w deploy/acme -d SITE_DOMAIN -d www.SITE_DOMAIN -d API_DOMAIN
server {
    listen 80;
    server_name SITE_DOMAIN www.SITE_DOMAIN API_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SITE_DOMAIN www.SITE_DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/SITE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_DOMAIN/privkey.pem;
    client_max_body_size 5m;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name API_DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/SITE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_DOMAIN/privkey.pem;
    client_max_body_size 5m;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (notifications)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
