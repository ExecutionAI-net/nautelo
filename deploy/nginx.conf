# Docker DNS re-resolves upstreams after container replacement and permits
# either environment to be offline without preventing proxy startup.
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DEV_WEB_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/nautelo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nautelo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location / {
        set $upstream http://nautelo-dev-web:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DEV_API_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/nautelo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nautelo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location /static/ { alias /srv/static/dev/; }
    location / {
        set $upstream http://nautelo-dev-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
