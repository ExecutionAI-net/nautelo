# Same-origin routing: retain /api/v1 paths; do not strip /api.
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80 default_server;
    server_name _;
    location = /proxy-health { access_log off; return 200 "ok\n"; }
    location / { return 444; }
}
server {
    listen 80;
    server_name dev.nautelo.com nautelo.com www.nautelo.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
server {
    listen 443 ssl;
    http2 on;
    server_name dev.nautelo.com;
    ssl_certificate /etc/nginx/origin/origin.pem;
    ssl_certificate_key /etc/nginx/origin/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location /static/ { alias /srv/static/dev/; }
    location ~ ^/(api|ws|admin)(/|$) {
        set $api_upstream http://nautelo-dev-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
    location / {
        set $web_upstream http://nautelo-dev-web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name nautelo.com www.nautelo.com;
    ssl_certificate /etc/nginx/origin/origin.pem;
    ssl_certificate_key /etc/nginx/origin/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location /static/ { alias /srv/static/prod/; }
    location ~ ^/(api|ws|admin)(/|$) {
        set $api_upstream http://nautelo-prod-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
    location / {
        set $web_upstream http://nautelo-prod-web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
