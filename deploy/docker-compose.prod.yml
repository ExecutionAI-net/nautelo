# Production stack for one EC2 host. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Postgres/Redis are containers here; move to RDS/ElastiCache later by changing DATABASE_URL/REDIS_URL
# in deploy/.env and removing the two services.
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nauta
      POSTGRES_USER: nauta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nauta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: python manage.py migrate --noinput

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *backend
    command: celery -A config worker -l info -Q default,media,maintenance
    depends_on:
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./acme:/var/www/acme
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  postgres_data:
