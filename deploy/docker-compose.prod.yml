# Managed by deploy/manage.py. Both environments use hardened Django settings.
name: nautelo-prod
x-backend: &backend
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE with an explicit tag}
  env_file:
    - path: ${RUNTIME_DIR:?Set RUNTIME_DIR}/backend.env
      format: raw
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ${RUNTIME_DIR}/postgres.env
        format: raw
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nautelo -d nautelo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  clamav:
    image: clamav/clamav:stable
    volumes: [clamav_data:/var/lib/clamav]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10
  migrate:
    <<: *backend
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput && (python manage.py ensure_places || true)"]
    volumes: [static_data:/app/staticfiles]
  api:
    <<: *backend
    networks:
      default: {}
      edge:
        aliases: [nautelo-prod-api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host':host,'X-Forwarded-Proto':'https'}), timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency=2 -Q default,notifications,media,maintenance
    depends_on:
      migrate: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule=/app/beat/celerybeat-schedule
    volumes: [beat_data:/app/beat]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE with an explicit tag}
    env_file:
      - path: ${RUNTIME_DIR}/frontend.env
        format: raw
    networks:
      default: {}
      edge:
        aliases: [nautelo-prod-web]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

networks:
  edge:
    external: true
    name: nautelo-prod-edge
volumes:
  postgres_data:
  redis_data:
  clamav_data:
  beat_data:
  static_data:
    name: nautelo-prod-static
