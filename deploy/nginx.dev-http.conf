# Temporary dev-only, same-origin HTTP access through port 80.
resolver 127.0.0.11 valid=10s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80 default_server;
    server_name ${DEV_HTTP_HOST};
    client_max_body_size 5m;
    location = /proxy-health { access_log off; return 200 "ok\n"; }
    location /static/ { alias /srv/static/dev/; }
    location ~ ^/(api|ws|admin)(/|$) {
        set $api_upstream http://nautelo-dev-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
    location / {
        set $web_upstream http://nautelo-dev-web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
