name: nautelo-proxy
services:
  nginx:
    image: nginx:stable-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - /etc/nautelo/tls:/etc/nginx/origin:ro
      - dev_static:/srv/static/dev:ro
      - prod_static:/srv/static/prod:ro
    networks: [dev, prod]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/proxy-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  dev:
    external: true
    name: nautelo-dev-edge
  prod:
    external: true
    name: nautelo-prod-edge
volumes:
  dev_static:
    external: true
    name: nautelo-dev-static
  prod_static:
    external: true
    name: nautelo-prod-static
